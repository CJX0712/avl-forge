<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AVLForge — AVL 树锻造炉</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 "Cascadia Code",Consolas,"Microsoft YaHei",monospace;padding:24px}
  h1{font-size:20px;margin-bottom:4px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  label{color:var(--dim);font-size:12px}
  input[type=text],input[type=number]{width:110px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--fg);padding:8px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:#21262d;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  canvas{display:block;background:#0a0d12;border-radius:6px;width:100%}
  .stats{color:var(--dim);font-size:12px;margin-top:8px}
  .stats b{color:var(--fg)}
  #selftest{font-size:12px}
  #selftest .t{display:flex;gap:8px;padding:2px 0}
  .t .pass{color:var(--ok)} .t .fail{color:var(--bad)}
  footer{color:var(--dim);font-size:11px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<h1>AVL<span>Forge</span> — AVL 树锻造炉</h1>
<div class="sub">自平衡二叉搜索树 · 旋转可视化 · 五重结构不变量自检 · 零依赖 · 离线单文件</div>

<div class="panel">
  <div class="row">
    <input type="number" id="val" value="42" placeholder="数值">
    <button id="btnIns">插入</button>
    <button id="btnDel">删除</button>
    <button id="btnRand">随机 50 插入</button>
    <button id="btnRandDel">随机 20 删除</button>
    <button id="btnClear">清空</button>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="panel">
  <canvas id="cv" width="880" height="420"></canvas>
</div>

<div class="panel">
  <div class="row"><b>内置自检</b><button id="runTest">重新运行</button></div>
  <div id="selftest"></div>
</div>

<footer>AVLForge · 1962 Adelson-Velsky & Landis · 高度上界 1.4405·log₂(n+2) · CJX0712</footer>

<script id="engine">
const AVL = (function(){
  'use strict';

  function H(n){ return n ? n.h : 0; }
  function S(n){ return n ? n.s : 0; }
  function update(n){ n.h = 1 + Math.max(H(n.l), H(n.r)); n.s = 1 + S(n.l) + S(n.r); n.bf = H(n.l) - H(n.r); }

  function rotR(y){
    const x = y.l;
    y.l = x.r; x.r = y;
    update(y); update(x);
    return x;
  }
  function rotL(x){
    const y = x.r;
    x.r = y.l; y.l = x;
    update(x); update(y);
    return y;
  }
  function balance(n){
    update(n);
    if (n.bf > 1){
      if (H(n.l.l) >= H(n.l.r)) return rotR(n);   // LL
      n.l = rotL(n.l); return rotR(n);            // LR
    }
    if (n.bf < -1){
      if (H(n.r.r) >= H(n.r.l)) return rotL(n);   // RR
      n.r = rotR(n.r); return rotL(n);            // RL
    }
    return n;
  }

  function insertRec(n, v){
    if (!n) return { v, l: null, r: null, h: 1, s: 1, bf: 0 };
    if (v < n.v) n.l = insertRec(n.l, v);
    else if (v > n.v) n.r = insertRec(n.r, v);
    else return n; // duplicate ignored
    return balance(n);
  }

  function minOf(n){ while (n.l) n = n.l; return n; }

  function removeRec(n, v){
    if (!n) return null;
    if (v < n.v) n.l = removeRec(n.l, v);
    else if (v > n.v) n.r = removeRec(n.r, v);
    else {
      if (!n.l) return n.r;
      if (!n.r) return n.l;
      const m = minOf(n.r);
      n.v = m.v;
      n.r = removeRec(n.r, m.v);
    }
    return balance(n);
  }

  function contains(n, v){
    while (n){ if (v === n.v) return true; n = v < n.v ? n.l : n.r; }
    return false;
  }

  function inorder(n, out){
    out = out || [];
    if (n){ inorder(n.l, out); out.push(n.v); inorder(n.r, out); }
    return out;
  }

  // structural validation: returns list of violation strings (empty = perfect)
  function validate(n){
    const bad = [];
    function walk(node, lo, hi){
      if (!node) return 0;
      if (lo !== null && node.v <= lo) bad.push('BST order: ' + node.v + ' <= ' + lo);
      if (hi !== null && node.v >= hi) bad.push('BST order: ' + node.v + ' >= ' + hi);
      const hl = walk(node.l, lo, node.v);
      const hr = walk(node.r, node.v, hi);
      const realH = 1 + Math.max(hl, hr);
      if (node.h !== realH) bad.push('height field ' + node.h + ' != real ' + realH + ' @' + node.v);
      if (Math.abs(hl - hr) > 1) bad.push('balance |bf|>1: ' + (hl - hr) + ' @' + node.v);
      return realH;
    }
    // size check separately (simple recursion)
    function sz(node){ return node ? 1 + sz(node.l) + sz(node.r) : 0; }
    function checkSizes(node){
      if (!node) return 0;
      const s = 1 + checkSizes(node.l) + checkSizes(node.r);
      if (node.s !== s) bad.push('size field ' + node.s + ' != real ' + s + ' @' + node.v);
      return s;
    }
    walk(n, null, null);
    checkSizes(n);
    return bad;
  }

  // AVL height bound: n <= F(h+2)-1 ≈ 1.4405·log2(n+2)-0.3277
  function heightBound(n){ return 1.4405 * Math.log2(n + 2) - 0.3277; }

  return {
    insert: (root, v) => insertRec(root, v),
    remove: (root, v) => removeRec(root, v),
    contains, inorder, validate, heightBound,
    height: H, size: S,
    root: n => n
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = AVL;
</script>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  let root = null;
  const cv = $('cv'), ctx = cv.getContext('2d');

  function render(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    const nodes = [];
    let maxDepth = 0;
    (function layout(n, d){
      if (!n) return;
      layout(n.l, d + 1);
      nodes.push({ n, d, xi: nodes.length });
      maxDepth = Math.max(maxDepth, d);
      layout(n.r, d + 1);
    })(root, 0);
    if (!nodes.length){
      ctx.fillStyle = '#8b949e';
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('空树 — 输入数值点「插入」，或点「随机 50 插入」', cv.width / 2, cv.height / 2);
      $('stats').textContent = '空树';
      return;
    }
    const W = cv.width, Hh = cv.height;
    const stepX = Math.min(34, (W - 40) / Math.max(1, nodes.length));
    const stepY = Math.min(46, (Hh - 60) / Math.max(1, maxDepth));
    const x0 = (W - (nodes.length - 1) * stepX) / 2;
    const pos = new Map();
    nodes.forEach(p => pos.set(p.n, { x: x0 + p.xi * stepX, y: 30 + p.d * stepY }));
    // edges
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 1.2;
    nodes.forEach(p => {
      [['l'], ['r']].forEach(([k]) => {
        const c = p.n[k];
        if (c){
          const a = pos.get(p.n), b = pos.get(c);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      });
    });
    // nodes
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    nodes.forEach(p => {
      const { x, y } = pos.get(p.n);
      const col = p.n.bf === 0 ? '#3fb950' : Math.abs(p.n.bf) === 1 ? '#d29922' : '#f85149';
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1117'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = '#e6edf3';
      ctx.fillText(String(p.n.v), x, y + 4);
    });
    $('stats').innerHTML =
      '节点 <b>' + AVL.size(root) + '</b> · 高度 <b>' + AVL.height(root) + '</b>' +
      ' · 上界 <b>' + AVL.heightBound(AVL.size(root)).toFixed(1) + '</b>' +
      ' · <span style="color:#3fb950">bf=0</span> / <span style="color:#d29922">bf=±1</span>';
  }

  function op(fn){
    root = fn(root);
    render();
  }
  function getVal(){
    const v = Math.floor(+$('val').value);
    return isFinite(v) ? v : NaN;
  }
  $('btnIns').addEventListener('click', () => { const v = getVal(); if (!isNaN(v)) op(r => AVL.insert(r, v)); });
  $('btnDel').addEventListener('click', () => { const v = getVal(); if (!isNaN(v)) op(r => AVL.remove(r, v)); });
  $('btnRand').addEventListener('click', () => {
    for (let i = 0; i < 50; i++) root = AVL.insert(root, Math.floor(Math.random() * 1000));
    render();
  });
  $('btnRandDel').addEventListener('click', () => {
    for (let i = 0; i < 20; i++){
      const all = AVL.inorder(root);
      if (!all.length) break;
      root = AVL.remove(root, all[Math.floor(Math.random() * all.length)]);
    }
    render();
  });
  $('btnClear').addEventListener('click', () => { root = null; render(); });

  /* ---------- in-page self-test ---------- */
  function T(name, ok, msg){ return { name, ok, msg }; }
  function selfTest(){
    const out = [];
    try {
      let r = null, seed = 42;
      const rng = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      // 300 random ops with per-op validation
      const ref = new Set();
      let ok = true, bad = '';
      for (let k = 0; k < 300; k++){
        const v = Math.floor(rng() * 100);
        if (rng() < 0.7){ r = AVL.insert(r, v); ref.add(v); }
        else { r = AVL.remove(r, v); ref.delete(v); }
        const bads = AVL.validate(r);
        if (bads.length){ ok = false; bad = 'op ' + k + ': ' + bads[0]; break; }
        const io = AVL.inorder(r), sorted = [...ref].sort((a, b) => a - b);
        if (io.length !== sorted.length || io.some((x, i) => x !== sorted[i])){ ok = false; bad = 'op ' + k + ': inorder mismatch'; break; }
      }
      out.push(T('300 随机操作逐操作校验（结构+中序=排序数组）', ok, bad));
      // AVL height bound at n=1000
      r = null; seed = 7;
      for (let k = 0; k < 1000; k++) r = AVL.insert(r, Math.floor(rng() * 1000000));
      out.push(T('n=1000 高度 ≤ 1.4405·log₂(n+2)−0.328', AVL.height(r) <= AVL.heightBound(1000),
        'h=' + AVL.height(r) + ' bound=' + AVL.heightBound(1000).toFixed(1)));
      // classic rotation shapes
      let t1 = null; [1, 2, 3].forEach(v => t1 = AVL.insert(t1, v));
      let t2 = null; [3, 2, 1].forEach(v => t2 = AVL.insert(t2, v));
      let t3 = null; [1, 2, 3, 4, 5].forEach(v => t3 = AVL.insert(t3, v));
      out.push(T('经典旋转：[1,2,3]→根2 · [3,2,1]→根2 · [1..5]→根2(最低失衡点单旋, h=3)',
        t1.v === 2 && t2.v === 2 && t3.v === 2 && AVL.height(t3) === 3,
        'got ' + t1.v + ',' + t2.v + ',' + t3.v));
      // duplicates + delete nonexistent
      let t4 = null; t4 = AVL.insert(t4, 5); t4 = AVL.insert(t4, 5); t4 = AVL.remove(t4, 9);
      out.push(T('重复插入忽略 + 删不存在值无副作用', AVL.size(t4) === 1 && AVL.contains(t4, 5) && !AVL.contains(t4, 9)));
    } catch (e){
      out.push(T('selftest crashed', false, e.message));
    }
    $('selftest').innerHTML = out.map(x =>
      '<div class="t"><span class="' + (x.ok ? 'pass' : 'fail') + '">' + (x.ok ? '✓' : '✗') + '</span>' +
      '<span>' + x.name + '</span>' + (x.msg ? '<span class="dim">' + x.msg + '</span>' : '') + '</div>').join('');
  }
  $('runTest').addEventListener('click', selfTest);

  render();
  selfTest();
})();
</script>
</body>
</html>
